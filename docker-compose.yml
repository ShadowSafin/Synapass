# Synapass - complete local and self-hosted stack.
#
# Everything the platform needs in one file: the data stores, the message bus, the
# gateway, the intelligence workers, the dashboard and the full observability
# chain. `docker compose up` produces a working installation, not a demo.
#
# ARM64 / amd64: this stack deploys on both. No `platform:` is pinned anywhere
# on purpose -- every third-party image below (postgres, redis, clickhouse,
# nats, otel-collector, prometheus, loki, promtail, grafana) is multi-arch, and
# the locally built services (gateway, workers, dashboard) are multi-arch too:
# their Dockerfiles build from multi-arch bases (golang, alpine, node, python)
# and the gateway resolves the cloudflared binary + GOARCH from TARGETARCH.
#   * Native on the VPS (simplest): `docker compose up --build -d` on the ARM64
#     host. BuildKit sets TARGETARCH automatically, so the right arch is built.
#   * Cross-built from an amd64 laptop: `docker buildx build --platform
#     linux/arm64 ...` or `DOCKER_DEFAULT_PLATFORM=linux/arm64 docker compose
#     build`. The gateway Dockerfile uses `--platform=$BUILDPLATFORM` for the
#     builder stage and cross-compiles Go to TARGETARCH.
#   * ClickHouse ARM requirement: the arm64 image needs ARMv8.2-A + RCpc
#     (Graviton >= 2, Ampere Altra, Oracle ARM -- all fine). Raspberry Pi 4 /
#     older ARMv8.0 boards are NOT supported by ClickHouse and will crash.
#   * Give the VPS >= 4 GB RAM: ClickHouse + Prometheus + Grafana are the heavy
#     part, on either arch.
#
# Design notes
#
#   * Health checks gate every dependency, so the gateway does not start against a
#     database that is still initialising. `depends_on: condition:
#     service_healthy` is what makes `up` reliable rather than a race.
#   * Named volumes hold all state. `docker compose down` removes containers and
#     keeps data; `down -v` is the explicit reset.
#   * Ports are bound to 127.0.0.1 by default so a developer laptop is not
#     accidentally exposing an unauthenticated inference endpoint. Change to
#     "0.0.0.0:8080" for a real deployment behind a firewall.
#   * Resource limits are set on the gateway. An unbounded gateway under a traffic
#     spike takes down the database on the same host, which is the single most
#     common self-hosting failure.

name: synapass

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  # ---------------------------------------------------------------------------
  # Data stores
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synapass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapass}
      POSTGRES_DB: ${POSTGRES_DB:-synapass}
      # The gateway is the only client, and it connects over the compose network,
      # so password auth over an unencrypted local socket is sufficient here.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    # pg_isready returns 0 only once the server accepts connections, which is what
    # the depends_on condition actually needs.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapass} -d ${POSTGRES_DB:-synapass}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    <<: [*restart, *logging]
    # appendonly keeps rate-limit and budget counters across a restart. Losing them
    # would only mean a tenant momentarily gets a fresh window, but keeping them is
    # cheap and makes the numbers trustworthy.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "512mb"
      - --maxmemory-policy
      - "allkeys-lru"
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    <<: [*restart, *logging]
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-synapass}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-synapass}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-synapass}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      # ClickHouse refuses to start with a low fd limit and the default on many
      # hosts is below what it wants.
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  nats:
    image: nats:2.10-alpine
    <<: [*restart, *logging]
    # JetStream is required: the eval and replay jobs rely on durable consumers, so
    # a worker restart resumes rather than losing work.
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    volumes:
      - nats-data:/data
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/varz | grep -q server_id || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Control plane
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.gateway
      args:
        VERSION: ${SYNAPASS_VERSION:-dev}
        COMMIT: ${SYNAPASS_COMMIT:-unknown}
        BUILD_DATE: ${SYNAPASS_BUILD_DATE:-unknown}
    <<: [*restart, *logging]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      SYNAPASS_ENVIRONMENT: ${SYNAPASS_ENVIRONMENT:-production}
      SYNAPASS_HTTP_ADDR: ":8080"
      # Environment-only configuration: the image ships a config file, and these
      # override it. Anything set here wins, which is the same precedence a native
      # install sees.
      SYNAPASS_DATABASE_DSN: postgres://${POSTGRES_USER:-synapass}:${POSTGRES_PASSWORD:-synapass}@postgres:5432/${POSTGRES_DB:-synapass}?sslmode=disable
      SYNAPASS_REDIS_ADDR: redis:6379
      SYNAPASS_CLICKHOUSE_ADDR: clickhouse:9000
      SYNAPASS_CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-synapass}
      SYNAPASS_CLICKHOUSE_USERNAME: ${CLICKHOUSE_USER:-synapass}
      SYNAPASS_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-synapass}
      SYNAPASS_NATS_URL: nats://nats:4222
      SYNAPASS_OTEL_ENDPOINT: otel-collector:4318
      SYNAPASS_OTEL_INSECURE: "true"
      SYNAPASS_PROMETHEUS_ENABLED: "true"
      # Response-cache tiers. The exact tier needs both switches; prefix and
      # semantic follow the shipped config defaults unless overridden here.
      # These must be listed explicitly: compose only injects variables that
      # are interpolated below, so a bare `.env` entry would be ignored.
      SYNAPASS_CACHE_RESPONSE_ENABLED: ${SYNAPASS_CACHE_RESPONSE_ENABLED:-false}
      SYNAPASS_CACHE_EXACT_ENABLED: ${SYNAPASS_CACHE_EXACT_ENABLED:-true}
      SYNAPASS_LOG_FORMAT: json
      # The dashboard origin must be allowed explicitly; a wildcard is refused in
      # production by configuration validation.
      SYNAPASS_HTTP_CORS_ALLOWED_ORIGINS: ${SYNAPASS_HTTP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # The bootstrap administrator credential. Without it a fresh production
      # install cannot be administered, and configuration validation refuses to
      # start. Override this outside a local evaluation.
      SYNAPASS_ADMIN_KEY: ${SYNAPASS_ADMIN_KEY:-syn_admin_change_me_in_production_000000}
      SYNAPASS_POSTGRES_AUTO_MIGRATE: "true"
      # Provider credentials are passed through empty by default. A provider with
      # no reachable credential fails to construct, is reported on the admin
      # provider endpoint, and is excluded from routing rather than breaking startup.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Temporary public tunnels (Cloudflare quick tunnels). On by default in
      # Docker: the gateway image ships cloudflared, and enabling exposes
      # nothing until an operator creates a tunnel from the dashboard
      # (/tunnels) or POST /admin/v1/tunnels/create. Set false to remove the
      # capability entirely.
      SYNAPASS_TUNNEL_ENABLED: ${SYNAPASS_TUNNEL_ENABLED:-true}
      # Inside Docker the dashboard target resolves over the compose network.
      SYNAPASS_TUNNEL_DASHBOARD_TARGET: ${SYNAPASS_TUNNEL_DASHBOARD_TARGET:-http://dashboard:3000}
    ports:
      # GATEWAY_PORT lets a host with something already on 8080 verify without
      # editing the file: GATEWAY_PORT=18080 docker compose up. The container
      # port stays 8080, so gateway config and docs do not change.
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"
    # A runaway gateway starves the database it shares a host with, which is the
    # most common way a self-hosted install falls over.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 128M

  # ---------------------------------------------------------------------------
  # Intelligence tier
  # ---------------------------------------------------------------------------
  workers:
    build:
      context: workers
      dockerfile: Dockerfile
    <<: [*restart, *logging]
    depends_on:
      nats:
        condition: service_healthy
    environment:
      SYNAPASS_WORKER_NATS_URL: nats://nats:4222
      SYNAPASS_WORKER_METRICS_ADDR: "0.0.0.0:9101"
      SYNAPASS_WORKER_LOG_FORMAT: json
      # Point at a local judge to enable rubric-based evaluation. Left empty,
      # judging is disabled and the deterministic scorers are the only signal.
      SYNAPASS_WORKER_PROVIDER_URL: ${SYNAPASS_WORKER_PROVIDER_URL:-}
      SYNAPASS_WORKER_PROVIDER_MODEL: ${SYNAPASS_WORKER_PROVIDER_MODEL:-}
      SYNAPASS_WORKER_LABELS: pool=default
    ports:
      - "127.0.0.1:9101:9101"

  dashboard:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.dashboard
      args:
        # Inlined into the browser bundle at build time, so it must be the address
        # a browser can reach, not the compose service name.
        NEXT_PUBLIC_SYNAPASS_API_URL: ${NEXT_PUBLIC_SYNAPASS_API_URL:-http://localhost:8080}
    <<: [*restart, *logging]
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      # Server-side calls go over the compose network, which is faster and does not
      # depend on the browser's view of the host.
      SYNAPASS_API_URL: http://gateway:8080
      SYNAPASS_ADMIN_KEY: ${SYNAPASS_ADMIN_KEY:-syn_admin_change_me_in_production_000000}
      # Public LAN address shown on the Endpoints page so other devices on the
      # network get a working URL (e.g. http://192.168.1.20:18080). Empty hides
      # the LAN block. Requires the gateway to bind your network (GATEWAY_BIND).
      GATEWAY_LAN_URL: ${GATEWAY_LAN_URL:-}
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:3000:3000"

  # ---------------------------------------------------------------------------
  # Observability
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    <<: [*restart, *logging]
    command: ["--config=/etc/otel/config.yaml"]
    environment:
      SYNAPASS_ENVIRONMENT: ${SYNAPASS_ENVIRONMENT:-production}
    volumes:
      - ./deploy/otel/collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318" # OTLP/HTTP
      - "127.0.0.1:4317:4317" # OTLP/gRPC
      - "127.0.0.1:8889:8889" # collector self-metrics

  prometheus:
    image: prom/prometheus:v2.54.1
    <<: [*restart, *logging]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  loki:
    image: grafana/loki:3.1.1
    <<: [*restart, *logging]
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./deploy/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  promtail:
    image: grafana/promtail:3.1.1
    <<: [*restart, *logging]
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./deploy/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Read-only access to the Docker socket is what lets Promtail discover
      # container logs. It is a real privilege: enable it only where the
      # observability stack is trusted, and prefer the Docker logging driver in a
      # shared environment.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.2.0
    <<: [*restart, *logging]
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Provisioned dashboards are read-only: an operator who wants to edit one
      # saves a copy, which keeps the shipped definitions the source of truth.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/synapass-overview.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  postgres-data:
  redis-data:
  clickhouse-data:
  clickhouse-logs:
  nats-data:
  prometheus-data:
  loki-data:
  grafana-data:
